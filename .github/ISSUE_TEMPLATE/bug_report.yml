name: Bug Report
description: Something broke. Let's fix it.
title: "[BUG]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: "What happened?"
      description: "What did you see vs. what you expected."
      placeholder: "I ran kustomize build and got..."
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: "How to reproduce"
      description: "Steps to hit the same issue."
      placeholder: |
        1. Clone the repo
        2. Run `kustomize build k8s/overlays/...`
        3. See error
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: "Environment"
      description: "Whatever might be relevant."
      placeholder: |
        OS: macOS / Ubuntu / ...
        Kubernetes: v1.28
        Kustomize: v5.x
        kubectl: v1.28
  - type: textarea
    id: logs
    attributes:
      label: "Logs or error output"
      description: "Paste any relevant output."
      render: shell
