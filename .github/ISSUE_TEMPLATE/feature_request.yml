name: Feature Request
description: A new component, bundle, or improvement.
title: "[FEAT]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: "What's the idea?"
      description: "What do you want to see? A new component, a better pattern, a missing integration?"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: "Why does it matter?"
      description: "What problem does it solve? What does it enable?"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives you've considered"
      description: "Anything else you've tried or thought about."
