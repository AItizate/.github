name: Idea
description: Suggest an idea for this project.
title: "[IDEA]: "
labels: ["idea"]
body:
  - type: textarea
    id: idea
    attributes:
      label: "What's your idea?"
      description: "A clear and concise description of your idea."
      placeholder: "Describe your idea here..."
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: "What is the motivation for this idea?"
      description: "A clear and concise description of the motivation for this idea."
      placeholder: "Describe the motivation here..."
    validations:
      required: true
